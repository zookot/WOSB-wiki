<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Орудия — WOSB Wiki</title>
    <meta name="description" content="Справочник орудий World of Sea Battle: стоимость крафта, типы, ресурсы">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .gun-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0;
            display: grid;
            grid-template-columns: 60px 1fr;
            grid-template-rows: auto auto;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .gun-card:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
        }

        .gun-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--bg-dark), rgba(30, 111, 168, 0.2));
            border: none;
            border-right: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            grid-row: 1;
        }

        .gun-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gun-info {
            flex: 1;
            min-width: 0;
            padding: 12px 16px;
        }

        .gun-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .gun-name {
            font-size: 14px;
            font-weight: 600;
            color: #e8f4ff;
        }

        .gun-prices {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }

        .gun-cost {
            font-size: 13px;
            color: var(--gold-light);
            font-weight: 700;
            white-space: nowrap;
        }

        .gun-cost-label {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 400;
            display: block;
        }

        .market-price {
            font-size: 13px;
            color: #4ade80;
            font-weight: 700;
        }

        .res-title {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .res-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .gun-footer {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid var(--border);
        }

        .type-section {
            margin-bottom: 28px;
        }

        .type-header {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent2);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .type-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .data-source {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: 600;
        }

        .data-source.live {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.25);
        }

        .data-source.local {
            background: rgba(201, 162, 39, 0.1);
            color: var(--gold);
            border: 1px solid rgba(201, 162, 39, 0.3);
        }

        .price-range {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price-range input[type="number"] {
            width: 80px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--gold-light);
            font-size: 13px;
            font-weight: 700;
            padding: 4px 8px;
            text-align: center;
        }

        .price-range input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .price-value {
            color: var(--gold-light);
            font-weight: 700;
            font-size: 13px;
        }

        .sort-buttons {
            display: flex;
            gap: 4px;
        }

        .sort-btn {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .sort-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #e8f4ff;
        }

        .sort-btn.active {
            background: rgba(42, 159, 214, 0.2);
            border-color: var(--accent2);
            color: var(--accent2);
        }

        .favorites-panel {
            background: rgba(74, 222, 128, 0.06);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: none;
        }

        .favorites-panel.visible {
            display: block;
        }

        .favorites-panel-header {
            font-size: 12px;
            font-weight: 700;
            color: #4ade80;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .favorites-panel-header button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .favorites-panel-header button:hover {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }

        .favorites-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .fav-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(74, 222, 128, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 20px;
            font-size: 12px;
            color: #4ade80;
            cursor: pointer;
            transition: all 0.2s;
        }

        .fav-chip:hover {
            background: rgba(248, 113, 113, 0.2);
            border-color: rgba(248, 113, 113, 0.5);
            color: #f87171;
        }

        .fav-chip .remove {
            font-size: 10px;
            opacity: 0.7;
        }

        .gun-card {
            position: relative;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .gun-card.lifted {
            animation: liftCard 0.5s ease-out;
        }

        @keyframes liftCard {
            0% { transform: translateY(10px); opacity: 0.5; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .gun-card.in-favorites {
            border-color: rgba(74, 222, 128, 0.4);
            background: rgba(74, 222, 128, 0.04);
        }

        .favorite-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .favorite-btn:hover {
            background: rgba(74, 222, 128, 0.2);
            border-color: #4ade80;
            color: #4ade80;
        }

        .favorite-btn.active {
            background: rgba(74, 222, 128, 0.25);
            border-color: #4ade80;
            color: #4ade80;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 2px;
        }

        .quantity-control input {
            width: 36px;
            background: rgba(255,255,255,0.05);
            border: none;
            color: var(--gold-light);
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            padding: 2px;
        }

        .quantity-control input:focus {
            outline: none;
            background: rgba(255,255,255,0.1);
        }

        .quantity-control button {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #e8f4ff;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .quantity-control button:hover {
            background: var(--accent);
        }

        .total-sum {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 700;
        }

        .total-sum span {
            color: var(--gold);
        }

        .favorites-section {
            margin-bottom: 24px;
        }

        .favorites-section .type-header {
            color: #4ade80;
        }

        .favorites-section .gun-card {
            border-color: rgba(74, 222, 128, 0.3);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo"><span class="logo-anchor">⚓</span> WOSB Wiki</a>
            <nav>
                <a href="index.html">🚢 <span class="nav-text">Корабли</span></a>
                <a href="craft.html">🔨 <span class="nav-text">Крафт</span></a>
                <a href="calculator.html">🧮 <span class="nav-text">Калькулятор</span></a>
                <a href="guns.html" class="active">💣 <span class="nav-text">Орудия</span></a>
            </nav>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1 class="page-title">💣 Орудия</h1>
            <p class="page-subtitle">Стоимость крафта и ресурсы для всех орудий</p>
        </div>

        <div class="filters" style="margin-bottom:24px;">
            <div class="filter-group">
                <div class="filter-label">🔍 Поиск</div>
                <input type="text" id="search-input" placeholder="Название орудия...">
            </div>
            <div class="filter-group">
                <div class="filter-label">🎯 Тип</div>
                <div class="btn-group" id="type-filters"></div>
            </div>
            <div class="filter-group">
                <div class="filter-label">💰 Цена ≥</div>
                <div class="price-range">
                    <input type="number" id="price-filter" placeholder="0" min="0" value="">
                </div>
            </div>
            <div class="filter-group">
                <div class="filter-label">↕ Сортировка</div>
                <div class="sort-buttons">
                    <button class="sort-btn" id="sort-desc" title="Сначала дорогие">↓ Дорогие</button>
                    <button class="sort-btn" id="sort-asc" title="Сначала дешёвые">↑ Дешёвые</button>
                </div>
            </div>
            <button class="btn-reset" id="btn-reset">↺ Сбросить</button>
        </div>

        <div class="favorites-panel" id="favorites-panel">
            <div class="favorites-panel-header">
                <span>⭐ Избранные орудия</span>
                <button id="clear-favorites">Очистить всё</button>
            </div>
            <div class="favorites-grid" id="favorites-grid"></div>
        </div>

        <div class="stats-bar">
            <div class="stat-chip">Найдено: <span id="gun-count">0</span> орудий</div>
            <div class="stat-chip" id="src-indicator"></div>
        </div>

        <div id="loader" style="text-align:center;padding:60px;color:var(--text-muted)">
            <span style="font-size:32px;display:block;margin-bottom:12px;animation:spin 1s linear infinite">⚓</span>
            Загружаем данные...
        </div>
        <div id="guns-container" style="display:none"></div>
    </main>

<script src="js/config.js"></script>
    <script src="js/guns_data.js"></script>
    <script>
        const GUN_RES_COLS = ['gold', 'iron', 'copper', 'bronze', 'rum', 'volcanic', 'pirate_token'];

        let ALL_GUNS = [];
        let activeType = null;
        let searchQuery = '';
        let priceMin = 0;
        let sortOrder = null;
        let favorites = new Set(JSON.parse(localStorage.getItem('wosb_favorites') || '[]'));
        let quantities = JSON.parse(localStorage.getItem('wosb_quantities') || '{}');

        function saveFavorites() {
            localStorage.setItem('wosb_favorites', JSON.stringify([...favorites]));
        }

        function saveQuantities() {
            localStorage.setItem('wosb_quantities', JSON.stringify(quantities));
        }

        function dbToGun(row) {
            const res = {};
            GUN_RES_COLS.forEach(c => { if (row[c] > 0) res[c] = row[c]; });
            return { name: row.name, type: row.type, qty: row.qty || 1, cost: row.craft_cost || 0, res, market_price: row.market_price || 0 };
        }

        async function loadGuns() {
            const { data, error } = await db.from('guns').select('*').order('id');
            if (error) throw error;
            return data.map(dbToGun);
        }

        function localGuns() {
            return GUNS.map(g => {
                const res = {};
                GUN_RES_COLS.forEach(k => { if (g[k] > 0) res[k] = g[k]; });
                return { name: g.name, type: g.type, qty: g.qty || 1, cost: g.cost || 0, res };
            });
        }

        function filtered() {
            return ALL_GUNS.filter(g =>
                (!activeType || g.type === activeType) &&
                (!searchQuery || g.name.toLowerCase().includes(searchQuery)) &&
                ((g.market_price || 0) >= priceMin)
            );
        }

        function sortedGuns(guns) {
            const sorted = [...guns].sort((a, b) => {
                const aFav = favorites.has(a.name);
                const bFav = favorites.has(b.name);
                const aQty = quantities[a.name] || 1;
                const bQty = quantities[b.name] || 1;

                if (aFav && !bFav) return -1;
                if (!aFav && bFav) return 1;

                if (aFav && bFav) {
                    if (aQty > 1 && bQty <= 1) return -1;
                    if (bQty > 1 && aQty <= 1) return 1;
                } else {
                    if (aQty > 1 && bQty <= 1) return -1;
                    if (bQty > 1 && aQty <= 1) return 1;
                }

                return 0;
            });

            if (sortOrder === 'desc') {
                sorted.sort((a, b) => (b.market_price || 0) - (a.market_price || 0));
            } else if (sortOrder === 'asc') {
                sorted.sort((a, b) => (a.market_price || 0) - (b.market_price || 0));
            }

            return sorted;
        }

        function renderFavoritesPanel() {
            const panel = document.getElementById('favorites-panel');
            const grid = document.getElementById('favorites-grid');

            if (favorites.size === 0) {
                panel.classList.remove('visible');
                return;
            }

            panel.classList.add('visible');
            grid.innerHTML = [...favorites].map(name => `
                <span class="fav-chip" data-name="${name}">
                    ${name}
                    <span class="remove">×</span>
                </span>
            `).join('');
        }

        function render() {
            const guns = sortedGuns(filtered());
            document.getElementById('gun-count').textContent = guns.length;

            const types = ['Пушка', 'Кульверина', 'Карронада', 'Бомбарда', 'Мортира'];

            const favGuns = guns.filter(g => favorites.has(g.name));
            const byType = {};
            types.forEach(t => byType[t] = guns.filter(g => g.type === t));

            const renderCards = (items) => items.map(g => {
                const res = Object.entries(g.res).map(([k, v]) => {
                    const r = GUN_RES_LABELS[k];
                    if (!r) return '';
                    return `<div class="res-item" title="${r.label}">
                        <span class="res-emoji">${r.emoji}</span>
                        <span class="res-value">${v.toLocaleString('ru-RU')}</span>
                    </div>`;
                }).join('');

                const craftCost = g.cost > 0
                    ? `<div style="color:var(--gold-light);font-size:12px;font-weight:700">${g.cost.toLocaleString('ru-RU')} 🪙</div><div class="gun-cost-label">себестоимость</div>`
                    : `<div style="color:var(--text-muted);font-size:11px">— только биржа</div>`;

                const marketPrice = g.market_price
                    ? `<div style="color:#4ade80;font-size:12px;font-weight:700">${Number(g.market_price).toLocaleString('ru-RU')} 🪙</div>`
                    : `<div style="color:var(--text-muted);font-size:11px;font-style:italic">n/a</div>`;

                const iconHtml = g.img
                    ? `<img src="resources/${g.img}" alt="${g.name}">`
                    : GUN_TYPE_ICONS[g.type] || '💥';

                const isFav = favorites.has(g.name);
                const qty = quantities[g.name] || 1;
                const unitPrice = g.market_price || 0;
                const totalPrice = unitPrice * qty;

                const favBtn = `<button class="favorite-btn ${isFav ? 'active' : ''}" data-name="${g.name}" title="${isFav ? 'Убрать из избранного' : 'В избранное'}">${isFav ? '★' : '☆'}</button>`;

                const qtyCtrl = totalPrice > 0 ? `<div class="quantity-control">
                    <button class="qty-minus" data-name="${g.name}">−</button>
                    <input type="number" class="qty-input" data-name="${g.name}" value="${qty}" min="1">
                    <button class="qty-plus" data-name="${g.name}">+</button>
                    ${qty > 1 ? `<div class="total-sum">Σ <span>${totalPrice.toLocaleString('ru-RU')}</span></div>` : ''}
                </div>` : '';

                return `<div class="gun-card ${isFav ? 'in-favorites' : ''}" data-name="${g.name}" data-price="${g.market_price || 0}">
                    <div class="gun-icon">${iconHtml}</div>
                    <div class="gun-info">
                        <div class="gun-header">
                            <div class="gun-name">${g.name}${g.qty > 1 ? ` <span style="color:var(--text-muted);font-size:12px">×${g.qty}</span>` : ''}</div>
                            <div class="gun-prices">
                                <div>${craftCost}</div>
                                <div style="margin-top:4px">${marketPrice}</div>
                            </div>
                        </div>
                        <div class="res-title">Ресурсы для крафт��</div>
                        <div class="res-grid">${res || '<span style="color:var(--text-muted);font-size:11px">нет ресурсов</span>'}</div>
                    </div>
                    <div class="gun-footer">
                        ${favBtn}
                        ${qtyCtrl}
                    </div>
                </div>`;
            }).join('');

            let html = '';

            if (favGuns.length > 0) {
                html += `<div class="favorites-section">
                    <div class="type-header">⭐ Избранные</div>
                    <div style="display:grid;gap:8px;">${renderCards(favGuns)}</div>
                </div>`;
            }

            html += types.map(type => {
                const items = byType[type];
                if (!items.length) return '';
                return `<div class="type-section">
                    <div class="type-header">${GUN_TYPE_ICONS[type]} ${type}</div>
                    <div style="display:grid;gap:8px;">${renderCards(items)}</div>
                </div>`;
            }).join('');

            document.getElementById('guns-container').innerHTML = html;
        }

        function attachCardEvents() {
            document.querySelectorAll('.favorite-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const name = btn.dataset.name;
                    if (favorites.has(name)) {
                        favorites.delete(name);
                    } else {
                        favorites.add(name);
                    }
                    saveFavorites();
                    renderFavoritesPanel();
                    render();
                    attachCardEvents();
                });
            });

            document.querySelectorAll('.qty-minus').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const name = btn.dataset.name;
                    const current = quantities[name] || 1;
                    if (current > 1) {
                        quantities[name] = current - 1;
                        saveQuantities();
                        animateLift(name);
                        render();
                        attachCardEvents();
                    }
                });
            });

            document.querySelectorAll('.qty-plus').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const name = btn.dataset.name;
                    const current = quantities[name] || 1;
                    quantities[name] = current + 1;
                    saveQuantities();
                    animateLift(name);
                    render();
                    attachCardEvents();
                });
            });

            document.querySelectorAll('.qty-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    e.stopPropagation();
                    const name = input.dataset.name;
                    const value = parseInt(input.value) || 1;
                    quantities[name] = Math.max(1, value);
                    saveQuantities();
                    animateLift(name);
                    render();
                    attachCardEvents();
                });
            });

            document.querySelectorAll('.fav-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const name = chip.dataset.name;
                    favorites.delete(name);
                    delete quantities[name];
                    saveFavorites();
                    saveQuantities();
                    renderFavoritesPanel();
                    render();
                    attachCardEvents();
                });
            });
        }

        function animateLift(name) {
            setTimeout(() => {
                const card = document.querySelector(`.gun-card[data-name="${name}"]`);
                if (card) {
                    card.classList.add('lifted');
                    setTimeout(() => card.classList.remove('lifted'), 500);
                }
            }, 10);
        }

        async function init() {
            const loader = document.getElementById('loader');
            const cont = document.getElementById('guns-container');
            const srcEl = document.getElementById('src-indicator');

            try {
                ALL_GUNS = await loadGuns();
                srcEl.innerHTML = '<span class="data-source live">🟢 Supabase</span>';
            } catch (e) {
                console.warn('Supabase недоступен:', e);
                ALL_GUNS = localGuns();
                srcEl.innerHTML = '<span class="data-source local">🟡 Локальные данные</span>';
            }

            loader.style.display = 'none';
            cont.style.display = 'block';

            const types = ['Пушка', 'Кульверина', 'Карронада', 'Бомбарда', 'Мортира'];
            const typeContainer = document.getElementById('type-filters');
            types.forEach(t => {
                const btn = document.createElement('button');
                btn.className = 'btn-filter';
                btn.innerHTML = `${GUN_TYPE_ICONS[t]} ${t}`;
                btn.addEventListener('click', () => {
                    activeType = activeType === t ? null : t;
                    document.querySelectorAll('#type-filters .btn-filter').forEach(b => b.classList.remove('active', 'active-type'));
                    if (activeType) btn.classList.add('active', 'active-type');
                    render();
                    attachCardEvents();
                });
                typeContainer.appendChild(btn);
            });

            const priceInput = document.getElementById('price-filter');
            priceInput.addEventListener('input', () => {
                priceMin = parseInt(priceInput.value) || 0;
                render();
                attachCardEvents();
            });

            document.getElementById('sort-desc').addEventListener('click', function() {
                sortOrder = sortOrder === 'desc' ? null : 'desc';
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                if (sortOrder) this.classList.add('active');
                render();
                attachCardEvents();
            });

            document.getElementById('sort-asc').addEventListener('click', function() {
                sortOrder = sortOrder === 'asc' ? null : 'asc';
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                if (sortOrder) this.classList.add('active');
                render();
                attachCardEvents();
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                activeType = null;
                searchQuery = '';
                priceMin = 0;
                sortOrder = null;
                priceInput.value = '';
                document.getElementById('search-input').value = '';
                document.querySelectorAll('.btn-filter, .sort-btn').forEach(b => b.classList.remove('active'));
                render();
                renderFavoritesPanel();
                attachCardEvents();
            });

            document.getElementById('search-input').addEventListener('input', function () {
                searchQuery = this.value.toLowerCase().trim();
                render();
                attachCardEvents();
            });

            document.getElementById('clear-favorites').addEventListener('click', () => {
                favorites.clear();
                quantities = {};
                saveFavorites();
                saveQuantities();
                renderFavoritesPanel();
                render();
                attachCardEvents();
            });

            renderFavoritesPanel();
            render();
            attachCardEvents();
        }

        init();
    </script>
</body>

</html>
