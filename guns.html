<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Орудия — WOSB Wiki</title>
    <meta name="description" content="Справочник орудий World of Sea Battle: стоимость крафта, типы, ресурсы">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== КАРТОЧКА ===== */
        .gun-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0;
            display: grid;
            grid-template-columns: 60px 1fr;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .gun-card:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
        }

        .gun-card.expanded {
            border-color: var(--accent2);
            box-shadow: 0 0 0 1px rgba(42, 159, 214, 0.2), 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .gun-card.expanded.favorited {
            border-color: var(--gold);
            box-shadow: 0 0 0 1px rgba(201, 162, 39, 0.3), 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .gun-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--bg-dark), rgba(30, 111, 168, 0.2));
            border: none;
            border-right: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            grid-row: 1;
        }

        .gun-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gun-info {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
        }

        .gun-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .gun-name {
            font-size: 14px;
            font-weight: 600;
            color: #e8f4ff;
            white-space: nowrap;
            flex-shrink: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* expand chevron */
        .expand-chevron {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: 2px;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-block;
            line-height: 1;
            flex-shrink: 0;
        }

        .gun-card.expanded .expand-chevron {
            transform: rotate(180deg);
            color: var(--accent2);
        }

        /* ===== БЛОК ЦЕН ===== */
        .gun-prices-row {
            display: flex;
            align-items: stretch;
            flex-shrink: 0;
            margin-left: auto;
            background: rgba(0, 0, 0, 0.22);
            border-radius: 7px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .price-cell {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1px;
            padding: 3px 9px;
        }

        .price-cell+.price-cell {
            border-left: 1px solid var(--border);
        }

        .price-cell-label {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
            line-height: 1;
        }

        .price-cell-value {
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            line-height: 1.3;
        }

        .price-cell-value.cost {
            color: var(--gold-light);
        }

        .price-cell-value.market {
            color: #4ade80;
        }

        .price-cell-value.income {
            color: #4ade80;
        }

        .price-cell-value.loss {
            color: #f87171;
        }

        .price-cell-value.na {
            color: var(--text-muted);
            font-style: italic;
            font-size: 10px;
        }

        /* ===== РЕСУРСЫ ===== */
        .res-title {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .res-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* ===== FOOTER КАРТОЧКИ ===== */
        .gun-footer {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--border);
        }

        /* ===== БЛОК 1: РАСКРЫТИЕ КАРТОЧКИ ===== */
        .gun-expand {
            grid-column: 1 / -1;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.3s ease;
            opacity: 0;
        }

        .gun-card.expanded .gun-expand {
            max-height: 800px;
            opacity: 1;
        }

        .gun-expand-inner {
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.22);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        @media (min-width: 680px) {
            .gun-expand-inner {
                flex-direction: row;
                align-items: flex-start;
            }

            .expand-section {
                flex: 1;
                min-width: 0;
            }
        }

        /* ===== БЛОК 3: ТАБЛИЦА СЕБЕСТОИМОСТИ ===== */
        .expand-section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--accent2);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .expand-table-wrap {
            overflow-x: auto;
        }

        .expand-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .expand-table th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 4px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .expand-table td {
            padding: 5px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: #c8d8e8;
            white-space: nowrap;
        }

        .expand-table tfoot td {
            border-top: 1px solid var(--border);
            border-bottom: none;
            padding-top: 8px;
            color: var(--gold-light);
            font-weight: 700;
        }

        .expand-table td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .share-bar-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 70px;
        }

        .share-bar-track {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
            min-width: 32px;
        }

        .share-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        .share-pct {
            font-size: 10px;
            color: var(--text-muted);
            min-width: 26px;
            text-align: right;
        }

        /* ===== ФИНАНСОВЫЕ ПОКАЗАТЕЛИ ===== */
        .fin-grid {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .fin-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            padding: 5px 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .fin-label {
            color: var(--text-muted);
            white-space: nowrap;
        }

        .fin-value {
            font-weight: 700;
            color: var(--gold-light);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .fin-value.income {
            color: #4ade80;
        }

        .fin-value.loss {
            color: #f87171;
        }

        .fin-roi-note {
            font-size: 10px;
            opacity: 0.75;
            font-weight: 400;
            display: block;
        }

        .expand-token-note {
            font-size: 12px;
            color: var(--text-muted);
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ===== ОСТАЛЬНЫЕ СТИЛИ (без изменений) ===== */
        .type-section {
            margin-bottom: 28px;
        }

        .type-header {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent2);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .type-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .data-source {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: 600;
        }

        .data-source.live {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.25);
        }

        .data-source.local {
            background: rgba(201, 162, 39, 0.1);
            color: var(--gold);
            border: 1px solid rgba(201, 162, 39, 0.3);
        }

        .price-range {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price-range input[type="number"] {
            width: 80px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--gold-light);
            font-size: 13px;
            font-weight: 700;
            padding: 4px 8px;
            text-align: center;
        }

        .price-range input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .sort-buttons {
            display: flex;
            gap: 4px;
        }

        .sort-btn {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .sort-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #e8f4ff;
        }

        .sort-btn.active {
            background: rgba(42, 159, 214, 0.2);
            border-color: var(--accent2);
            color: var(--accent2);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
        }

        .profit-calculator {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.08), rgba(201, 162, 39, 0.08));
            border: 1px solid rgba(74, 222, 128, 0.25);
            border-radius: 10px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .profit-calculator-label {
            font-size: 12px;
            font-weight: 600;
            color: #4ade80;
        }

        .profit-calculator-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--gold-light);
        }

        .profit-clear-btn {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.35);
            color: #f87171;
            cursor: pointer;
            transition: all 0.2s;
        }

        .profit-clear-btn:hover {
            background: rgba(248, 113, 113, 0.25);
            border-color: #f87171;
        }

        .gun-card.favorited {
            border-color: var(--gold);
            background: linear-gradient(135deg, rgba(201, 162, 39, 0.15), rgba(201, 162, 39, 0.05));
        }

        .gun-card.favorited:hover {
            border-color: var(--gold-light);
            background: linear-gradient(135deg, rgba(201, 162, 39, 0.2), rgba(201, 162, 39, 0.1));
        }

        .gun-card.lifted {
            animation: liftCard 0.5s ease-out;
        }

        @keyframes liftCard {
            0% {
                transform: translateY(10px);
                opacity: 0.5;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 2px;
        }

        .quantity-control input {
            width: 36px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--gold-light);
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            padding: 2px;
        }

        .quantity-control input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
        }

        .quantity-control button {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #e8f4ff;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .quantity-control button:hover {
            background: var(--accent);
        }

        .fav-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-muted);
            transition: all 0.2s;
            padding: 2px 4px;
        }

        .fav-btn:hover {
            color: var(--gold);
            transform: scale(1.2);
        }

        .total-sum {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 700;
        }

        .total-sum span {
            color: var(--gold);
        }
    </style>
</head>

<body>
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo"><span class="logo-anchor">⚓</span> WOSB Wiki</a>
            <nav>
                <a href="index.html">🚢 <span class="nav-text">Корабли</span></a>
                <a href="craft.html">🔨 <span class="nav-text">Крафт</span></a>
                <a href="calculator.html">🧮 <span class="nav-text">Калькулятор</span></a>
                <a href="guns.html" class="active">💣 <span class="nav-text">Орудия</span></a>
            </nav>
        </div>
    </header>

    <main>
        <div class="page-header">
            <div>
                <h1 class="page-title">💣 Орудия</h1>
                <p class="page-subtitle">Стоимость крафта и ресурсы для всех орудий</p>
            </div>
            <div class="profit-calculator" id="profit-calculator">
                <div class="profit-calculator-label">
                    <span id="calc-mode-icon">💰</span> <span id="calc-mode-text">Выручка</span>:
                </div>
                <div class="profit-calculator-value" id="profit-total">0 🪙</div>
                <button class="sort-btn" id="calc-mode-toggle" title="Переключить режим">≈ Прибыль</button>
                <button class="profit-clear-btn" id="profit-clear">Очистить</button>
            </div>
        </div>

        <div class="filters" style="margin-bottom:24px;">
            <div class="filter-group">
                <div class="filter-label">🔍 Поиск</div>
                <input type="text" id="search-input" placeholder="Название орудия...">
            </div>
            <div class="filter-group">
                <div class="filter-label">🎯 Тип</div>
                <div class="btn-group" id="type-filters"></div>
            </div>
            <div class="filter-group">
                <div class="filter-label">💰 Цена ≥</div>
                <div class="price-range">
                    <input type="number" id="price-filter" placeholder="0" min="0" value="">
                </div>
            </div>
            <div class="filter-group">
                <div class="filter-label">↕ Сортировка</div>
                <div class="sort-buttons">
                    <button class="sort-btn" id="sort-desc" title="Сначала дорогие">↓ Дорогие</button>
                    <button class="sort-btn" id="sort-asc" title="Сначала дешёвые">↑ Дешёвые</button>
                </div>
            </div>
            <button class="btn-reset" id="btn-reset">↺ Сбросить</button>
        </div>

        <div class="stats-bar">
            <div class="stat-chip">Найдено: <span id="gun-count">0</span> орудий</div>
            <div class="stat-chip" id="src-indicator"></div>
        </div>

        <div id="loader" style="text-align:center;padding:60px;color:var(--text-muted)">
            <span style="font-size:32px;display:block;margin-bottom:12px;animation:spin 1s linear infinite">⚓</span>
            Загружаем данные...
        </div>
        <div id="guns-container" style="display:none"></div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/guns_data.js"></script>
    <script>
        // ===== КОНСТАНТЫ =====
        const GUN_RES_COLS = ['gold', 'iron', 'copper', 'bronze', 'rum', 'volcanic', 'pirate_token', 'battle_mark'];

        // Маппинг колонки guns → название в таблице resources
        const RES_COL_TO_NAME = {
            gold: 'Золото',
            iron: 'Железо',
            copper: 'Медь',
            bronze: 'Бронза',
            rum: 'Ром',
            volcanic: 'Вулканическое железо',
            battle_mark: 'Боевая марка'
        };

        const RES_COL_EMOJI = {
            gold: '🪙',
            iron: '⚙️',
            copper: '🔶',
            bronze: '🫙',
            rum: '🍺',
            volcanic: '🌋',
            battle_mark: '⚔️',
            pirate_token: '🏴‍☠️'
        };

        // ===== СОСТОЯНИЕ =====
        let ALL_GUNS = [];
        let ALL_RESOURCES = [];   // Блок 2: загружается из Supabase
        let expandedCards = new Set(); // Блок 1: открытые карточки

        let activeType = null;
        let searchQuery = '';
        let priceMin = 0;
        let sortOrder = null;
        let calcMode = 'revenue';

        let quantities = JSON.parse(localStorage.getItem('wosb_gun_quantities') || '{}');
        let favorites = JSON.parse(localStorage.getItem('wosb_gun_favorites') || '{}');

        // ===== ХРАНЕНИЕ =====
        function saveQuantities() { localStorage.setItem('wosb_gun_quantities', JSON.stringify(quantities)); }
        function saveFavorites() { localStorage.setItem('wosb_gun_favorites', JSON.stringify(favorites)); }

        function toggleFavorite(name) {
            favorites[name] = !favorites[name];
            saveFavorites();
        }

        // ===== БЛОК 2: ЦЕНЫ РЕСУРСОВ =====
        function getUnitPrice(col) {
            const resName = RES_COL_TO_NAME[col];
            if (!resName) return 0;
            const r = ALL_RESOURCES.find(x => x.name === resName);
            if (!r) return 0;
            return r.is_base ? Number(r.cost_avg) : Number(r.cost_calc);
        }

        // ===== БЛОК 3: СТРУКТУРА СЕБЕСТОИМОСТИ =====
        function buildExpandHTML(g, qty) {
            const effectiveQty = Math.max(qty || 1, 1);
            const craftEntries = Object.entries(g.res).filter(([col]) => col !== 'pirate_token');
            const isTokenOnly = craftEntries.length === 0 && (g.res.pirate_token || 0) > 0;

            if (isTokenOnly) {
                const tokens = (g.res.pirate_token || 0) * effectiveQty;
                const marketVal = g.market_price > 0 ? g.market_price * effectiveQty : null;
                return `<div class="gun-expand-inner">
                    <div class="expand-section">
                        <div class="expand-section-title">🏴‍☠️ Стоимость</div>
                        <div class="expand-token-note">
                            Приобретается за <strong>${tokens.toLocaleString('ru-RU')} пиратских жетона</strong><br>
                            Крафт недоступен — себестоимость не рассчитывается.
                        </div>
                    </div>
                    ${buildFinancialHTML(null, marketVal, effectiveQty)}
                </div>`;
            }

            // Считаем строки таблицы
            let totalCost = 0;
            const rows = craftEntries.map(([col, amount]) => {
                const unitPrice = getUnitPrice(col);
                const totalAmt = amount * effectiveQty;
                const totalPrice = totalAmt * unitPrice;
                totalCost += totalPrice;
                return { col, amount, totalAmt, unitPrice, totalPrice };
            });
            rows.forEach(r => r.share = totalCost > 0 ? r.totalPrice / totalCost * 100 : 0);

            const marketVal = g.market_price > 0 ? g.market_price * effectiveQty : null;

            const tableRows = rows.map(r => {
                const emoji = RES_COL_EMOJI[r.col] || '📦';
                const label = RES_COL_TO_NAME[r.col] || r.col;
                const barW = Math.max(1, Math.round(r.share));
                const unitStr = r.unitPrice > 0
                    ? r.unitPrice.toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' 🪙'
                    : '—';
                const totalStr = r.totalPrice > 0
                    ? Math.round(r.totalPrice).toLocaleString('ru-RU') + ' 🪙'
                    : '—';
                return `<tr>
                    <td>${emoji} ${label}</td>
                    <td class="num">${r.totalAmt.toLocaleString('ru-RU')}</td>
                    <td class="num">${unitStr}</td>
                    <td class="num">${totalStr}</td>
                    <td class="num">
                        <div class="share-bar-wrap">
                            <div class="share-bar-track">
                                <div class="share-bar" style="width:${barW}%"></div>
                            </div>
                            <span class="share-pct">${Math.round(r.share)}%</span>
                        </div>
                    </td>
                </tr>`;
            }).join('');

            const totalStr = totalCost > 0
                ? Math.round(totalCost).toLocaleString('ru-RU') + ' 🪙'
                : '—';
            const titleSuffix = totalCost > 0
                ? ` (${Math.round(totalCost).toLocaleString('ru-RU')} 🪙)`
                : '';

            return `<div class="gun-expand-inner">
                <div class="expand-section">
                    <div class="expand-section-title">📊 Структура себестоимости${titleSuffix}</div>
                    <div class="expand-table-wrap">
                        <table class="expand-table">
                            <thead>
                                <tr>
                                    <th>Ресурс</th>
                                    <th>Кол-во</th>
                                    <th>Цена / ед.</th>
                                    <th>Итого</th>
                                    <th>Доля</th>
                                </tr>
                            </thead>
                            <tbody>${tableRows}</tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="3">Итого</td>
                                    <td class="num">${totalStr}</td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
                ${buildFinancialHTML(totalCost > 0 ? totalCost : null, marketVal, effectiveQty)}
            </div>`;
        }

        function buildFinancialHTML(craftCost, marketVal, qty) {
            const profit = (craftCost !== null && marketVal !== null) ? marketVal - craftCost : null;
            const margin = (profit !== null && marketVal > 0) ? profit / marketVal * 100 : null;
            const roi = (profit !== null && craftCost > 0) ? profit / craftCost * 100 : null;

            const pc = profit !== null ? (profit >= 0 ? 'income' : 'loss') : '';
            const sign = profit !== null && profit > 0 ? '+' : '';

            const roiNote = roi !== null && roi > 0
                ? `<span class="fin-roi-note">вложения окупаются в ${(1 + roi / 100).toFixed(1)}×</span>`
                : '';

            return `<div class="expand-section">
                <div class="expand-section-title">💹 Финансовые показатели${qty > 1 ? ' (×' + qty + ' шт.)' : ''}</div>
                <div class="fin-grid">
                    <div class="fin-row">
                        <span class="fin-label">💰 Цена биржи</span>
                        <span class="fin-value">${marketVal !== null ? marketVal.toLocaleString('ru-RU') + ' 🪙' : '—'}</span>
                    </div>
                    ${craftCost !== null ? `<div class="fin-row">
                        <span class="fin-label">🔧 Себестоимость</span>
                        <span class="fin-value">${Math.round(craftCost).toLocaleString('ru-RU')} 🪙</span>
                    </div>` : ''}
                    ${profit !== null ? `<div class="fin-row">
                        <span class="fin-label">📈 Прибыль</span>
                        <span class="fin-value ${pc}">${sign}${Math.round(profit).toLocaleString('ru-RU')} 🪙</span>
                    </div>` : ''}
                    ${margin !== null ? `<div class="fin-row">
                        <span class="fin-label">📊 Маржа</span>
                        <span class="fin-value ${pc}">${margin.toFixed(1)}%</span>
                    </div>` : ''}
                    ${roi !== null ? `<div class="fin-row">
                        <span class="fin-label">💹 ROI</span>
                        <span class="fin-value ${pc}">${roi.toFixed(1)}% ${roiNote}</span>
                    </div>` : ''}
                </div>
            </div>`;
        }

        // ===== ДАННЫЕ =====
        function updateProfitTotal() {
            let total = 0;
            ALL_GUNS.forEach(g => {
                const qty = quantities[g.name] || 0;
                if (qty <= 0) return;
                if (calcMode === 'profit') {
                    if (g.profit !== null) total += g.profit * qty;
                } else {
                    if (g.market_price > 0) total += g.market_price * qty;
                }
            });
            const el = document.getElementById('profit-total');
            if (el) el.textContent = total.toLocaleString('ru-RU') + ' 🪙';
        }

        function clearAllQuantities() {
            quantities = {};
            saveQuantities();
            render();
            attachCardEvents();
            updateProfitTotal();
        }

        function dbToGun(row) {
            const res = {};
            GUN_RES_COLS.forEach(c => { if (row[c] > 0) res[c] = row[c]; });
            const cost = row.craft_cost || 0;
            const market = row.market_price || 0;
            const profit = (cost > 0 && market > 0) ? market - cost : null;
            return { name: row.name, type: row.type, qty: row.qty || 1, cost, res, market_price: market, profit };
        }

        async function loadGuns() {
            const { data, error } = await db.from('guns').select('*').order('id');
            if (error) throw error;
            return data.map(dbToGun);
        }

        async function loadResources() {
            const { data, error } = await db.from('resources').select('name, cost_avg, cost_calc, is_base');
            if (error) throw error;
            return data || [];
        }

        function localGuns() {
            return GUNS.map(g => {
                const res = {};
                GUN_RES_COLS.forEach(k => { if (g[k] > 0) res[k] = g[k]; });
                const cost = g.cost || 0;
                return { name: g.name, type: g.type, qty: g.qty || 1, cost, res, market_price: 0, profit: null };
            });
        }

        // ===== ФИЛЬТРЫ И СОРТИРОВКА =====
        function filtered() {
            return ALL_GUNS.filter(g =>
                (!activeType || g.type === activeType) &&
                (!searchQuery || g.name.toLowerCase().includes(searchQuery)) &&
                ((g.market_price || 0) >= priceMin)
            );
        }

        function sortedGuns(guns) {
            const sorted = [...guns];
            if (sortOrder === 'desc') sorted.sort((a, b) => (b.market_price || 0) - (a.market_price || 0));
            else if (sortOrder === 'asc') sorted.sort((a, b) => (a.market_price || 0) - (b.market_price || 0));
            return sorted;
        }

        // ===== СТРОИМ СТРОКУ ЦЕН =====
        function buildPriceRow(g) {
            let costHtml;
            if (g.res.pirate_token > 0) {
                costHtml = `<div class="price-cell-value na">Жетоны</div>`;
            } else if (g.cost > 0) {
                costHtml = `<div class="price-cell-value cost">${g.cost.toLocaleString('ru-RU')} 🪙</div>`;
            } else {
                costHtml = `<div class="price-cell-value na">—</div>`;
            }

            const marketHtml = g.market_price > 0
                ? `<div class="price-cell-value market">${Number(g.market_price).toLocaleString('ru-RU')} 🪙</div>`
                : `<div class="price-cell-value na">—</div>`;

            let profitHtml;
            if (g.profit === null) {
                profitHtml = `<div class="price-cell-value na">—</div>`;
            } else if (g.profit >= 0) {
                profitHtml = `<div class="price-cell-value income">+${Math.round(g.profit).toLocaleString('ru-RU')} 🪙</div>`;
            } else {
                profitHtml = `<div class="price-cell-value loss">${Math.round(g.profit).toLocaleString('ru-RU')} 🪙</div>`;
            }
            const profitLabel = (g.profit !== null && g.profit < 0) ? 'Убыток' : 'Доход';

            return `<div class="gun-prices-row">
                <div class="price-cell">
                    <div class="price-cell-label">Крафт</div>
                    ${costHtml}
                </div>
                <div class="price-cell">
                    <div class="price-cell-label">Биржа</div>
                    ${marketHtml}
                </div>
                <div class="price-cell">
                    <div class="price-cell-label">${profitLabel}</div>
                    ${profitHtml}
                </div>
            </div>`;
        }

        // ===== РЕНДЕР =====
        function render() {
            const guns = sortedGuns(filtered());
            document.getElementById('gun-count').textContent = guns.length;

            const types = ['Пушка', 'Кульверина', 'Карронада', 'Бомбарда', 'Мортира'];

            const favoritesList = guns.filter(g => favorites[g.name]);
            const byType = {};
            types.forEach(t => byType[t] = guns.filter(g => g.type === t));

            const renderCards = (items) => items.map(g => {
                const res = Object.entries(g.res).map(([k, v]) => {
                    const r = GUN_RES_LABELS[k];
                    if (!r) return '';
                    return `<div class="res-item" title="${r.label}">
                        <span class="res-emoji">${r.emoji}</span>
                        <span class="res-value">${v.toLocaleString('ru-RU')}</span>
                    </div>`;
                }).join('');

                const iconHtml = g.img
                    ? `<img src="resources/${g.img}" alt="${g.name}">`
                    : GUN_TYPE_ICONS[g.type] || '💥';

                const qty = quantities[g.name] || 0;
                const unitPrice = g.market_price || 0;
                const totalPrice = unitPrice * qty;

                const qtyCtrl = unitPrice > 0 ? `<div class="quantity-control">
                    <button class="qty-minus" data-name="${g.name}">−</button>
                    <input type="number" class="qty-input" data-name="${g.name}" value="${qty}" min="0">
                    <button class="qty-plus" data-name="${g.name}">+</button>
                    <div class="total-sum"${qty <= 0 ? ' style="display:none"' : ''}>Σ <span class="qty-total-val">${totalPrice.toLocaleString('ru-RU')}</span></div>
                </div>` : '';

                const isFav = favorites[g.name];
                const favBtn = `<button class="fav-btn" data-name="${g.name}" style="color:${isFav ? 'var(--gold)' : 'var(--text-muted)'}"> ${isFav ? '★' : '☆'}</button>`;
                const isExpanded = expandedCards.has(g.name);

                // Блок 1+3: раскрытый контент (строится сразу при рендере если карточка открыта)
                const expandContent = isExpanded
                    ? buildExpandHTML(g, Math.max(qty, 1))
                    : '';

                return `<div class="gun-card${isFav ? ' favorited' : ''}${isExpanded ? ' expanded' : ''}" data-name="${g.name}" data-price="${g.market_price || 0}">
                    <div class="gun-icon">${iconHtml}</div>
                    <div class="gun-info">
                        <div class="gun-header">
                            <div class="gun-name">${g.name}${g.qty > 1 ? ` <span style="color:var(--text-muted);font-size:12px">×${g.qty}</span>` : ''}
                                <span class="expand-chevron">▼</span>
                            </div>
                            ${buildPriceRow(g)}
                        </div>
                        <div class="res-title">Ресурсы для крафта</div>
                        <div class="res-grid">${res || '<span style="color:var(--text-muted);font-size:11px">нет ресурсов</span>'}</div>
                    </div>
                    <div class="gun-footer">
                        ${favBtn}
                        <div style="margin-left:auto">${qtyCtrl}</div>
                    </div>
                    <div class="gun-expand">${expandContent}</div>
                </div>`;
            }).join('');

            let html = '';

            if (favoritesList.length > 0) {
                html += `<div class="type-section">
                    <div class="type-header" style="color:var(--gold)">★ Избранное</div>
                    <div style="display:grid;gap:8px;">${renderCards(favoritesList)}</div>
                </div>`;
            }

            html += types.map(type => {
                const items = byType[type].filter(g => !favorites[g.name]);
                if (!items.length) return '';
                return `<div class="type-section">
                    <div class="type-header">${GUN_TYPE_ICONS[type]} ${type}</div>
                    <div style="display:grid;gap:8px;">${renderCards(items)}</div>
                </div>`;
            }).join('');

            document.getElementById('guns-container').innerHTML = html;
            updateProfitTotal();
        }

        // ===== СОБЫТИЯ =====
        function attachCardEvents() {
            // Кнопки количества — Блок 5: без полного render()
            document.querySelectorAll('.qty-minus').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const name = btn.dataset.name;
                    const current = quantities[name] || 0;
                    if (current > 0) onQtyChange(name, current - 1);
                });
            });

            document.querySelectorAll('.qty-plus').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const name = btn.dataset.name;
                    onQtyChange(name, (quantities[name] || 0) + 1);
                });
            });

            document.querySelectorAll('.qty-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    e.stopPropagation();
                    onQtyChange(input.dataset.name, parseInt(input.value) || 0);
                });
                input.addEventListener('input', (e) => {
                    e.stopPropagation();
                    clearTimeout(input._debounce);
                    input._debounce = setTimeout(() => {
                        const val = parseInt(input.value);
                        if (!isNaN(val)) onQtyChange(input.dataset.name, val);
                    }, 300);
                });
            });

            // Избранное
            document.querySelectorAll('.fav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const name = btn.dataset.name;
                    toggleFavorite(name);
                    render();
                    attachCardEvents();
                });
            });

            // БЛОК 1: клик по карточке — раскрытие/закрытие
            document.querySelectorAll('.gun-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    // Не реагируем на клик по интерактивным элементам внутри карточки
                    if (e.target.closest('button, input, .quantity-control, .fav-btn', .gun-footer')) return;

                    const name = card.dataset.name;
                    const gun = ALL_GUNS.find(g => g.name === name);
                    if (!gun) return;

                    if (expandedCards.has(name)) {
                        // Закрываем: убираем класс и чистим контент после анимации
                        expandedCards.delete(name);
                        card.classList.remove('expanded');
                        const expandEl = card.querySelector('.gun-expand');
                        if (expandEl) {
                            // Ждём конца анимации, потом очищаем контент
                            expandEl.addEventListener('transitionend', () => {
                                if (!expandedCards.has(name)) expandEl.innerHTML = '';
                            }, { once: true });
                        }
                    } else {
                        // Открываем: добавляем класс и сразу рендерим содержимое
                        expandedCards.add(name);
                        card.classList.add('expanded');
                        const expandEl = card.querySelector('.gun-expand');
                        if (expandEl && !expandEl.innerHTML.trim()) {
                            const qty = Math.max(quantities[name] || 1, 1);
                            expandEl.innerHTML = buildExpandHTML(gun, qty);
                        }
                    }
                });
            });
        }

        function animateLift(name) {
            setTimeout(() => {
                const card = document.querySelector(`.gun-card[data-name="${name}"]`);
                if (card) {
                    card.classList.add('lifted');
                    setTimeout(() => card.classList.remove('lifted'), 500);
                }
            }, 10);
        }

        function onQtyChange(name, newQty) {
            quantities[name] = Math.max(0, newQty);
            saveQuantities();

            const gun = ALL_GUNS.find(g => g.name === name);
            const card = document.querySelector(`.gun-card[data-name="${CSS.escape(name)}"]`);
            if (!gun || !card) return;

            const qty = quantities[name];
            const unitPrice = gun.market_price || 0;
            const totalPrice = unitPrice * qty;

            const qtyInput = card.querySelector('.qty-input');
            if (qtyInput && parseInt(qtyInput.value) !== qty) qtyInput.value = qty;

            const totalSumEl = card.querySelector('.total-sum');
            if (totalSumEl) {
                if (qty > 0 && unitPrice > 0) {
                    totalSumEl.style.display = '';
                    const valEl = totalSumEl.querySelector('.qty-total-val');
                    if (valEl) valEl.textContent = totalPrice.toLocaleString('ru-RU');
                } else {
                    totalSumEl.style.display = 'none';
                }
            }

            if (expandedCards.has(name)) {
                const expandEl = card.querySelector('.gun-expand');
                if (expandEl) expandEl.innerHTML = buildExpandHTML(gun, Math.max(qty, 1));
            }

            updateProfitTotal();

            animateLift(name);
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        async function init() {
            const loader = document.getElementById('loader');
            const cont = document.getElementById('guns-container');
            const srcEl = document.getElementById('src-indicator');

            const fallbackTimeout = setTimeout(() => {
                console.warn('Supabase таймаут, используем локальные данные');
                ALL_GUNS = localGuns();
                srcEl.innerHTML = '<span class="data-source local">🟡 Локальные данные</span>';
                loader.style.display = 'none';
                cont.style.display = 'block';
                finishInit();
            }, 8000);

            try {
                // Блок 2: загружаем guns и resources параллельно
                const [guns, resources] = await Promise.all([
                    loadGuns(),
                    loadResources()
                ]);
                clearTimeout(fallbackTimeout);
                ALL_GUNS = guns;
                ALL_RESOURCES = resources;
                srcEl.innerHTML = '<span class="data-source live">🟢 Supabase</span>';
            } catch (e) {
                clearTimeout(fallbackTimeout);
                console.warn('Supabase недоступен:', e);
                ALL_GUNS = localGuns();
                srcEl.innerHTML = '<span class="data-source local">🟡 Локальные данные</span>';
            }

            loader.style.display = 'none';
            cont.style.display = 'block';
            finishInit();
        }

        function finishInit() {
            const types = ['Пушка', 'Кульверина', 'Карронада', 'Бомбарда', 'Мортира'];
            const typeContainer = document.getElementById('type-filters');
            types.forEach(t => {
                const btn = document.createElement('button');
                btn.className = 'btn-filter';
                btn.innerHTML = `${GUN_TYPE_ICONS[t]} ${t}`;
                btn.addEventListener('click', () => {
                    activeType = activeType === t ? null : t;
                    document.querySelectorAll('#type-filters .btn-filter').forEach(b => b.classList.remove('active', 'active-type'));
                    if (activeType) btn.classList.add('active', 'active-type');
                    render();
                    attachCardEvents();
                });
                typeContainer.appendChild(btn);
            });

            document.getElementById('price-filter').addEventListener('input', function () {
                priceMin = parseInt(this.value) || 0;
                render();
                attachCardEvents();
            });

            document.getElementById('sort-desc').addEventListener('click', function () {
                sortOrder = sortOrder === 'desc' ? null : 'desc';
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                if (sortOrder) this.classList.add('active');
                render();
                attachCardEvents();
            });

            document.getElementById('sort-asc').addEventListener('click', function () {
                sortOrder = sortOrder === 'asc' ? null : 'asc';
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                if (sortOrder) this.classList.add('active');
                render();
                attachCardEvents();
            });

            document.getElementById('search-input').addEventListener('input', function () {
                searchQuery = this.value.trim().toLowerCase();
                render();
                attachCardEvents();
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                activeType = null;
                searchQuery = '';
                priceMin = 0;
                sortOrder = null;
                document.getElementById('search-input').value = '';
                document.getElementById('price-filter').value = '';
                document.querySelectorAll('.btn-filter, .sort-btn').forEach(b => b.classList.remove('active', 'active-type'));
                render();
                attachCardEvents();
            });

            document.getElementById('profit-clear').addEventListener('click', clearAllQuantities);

            document.getElementById('calc-mode-toggle').addEventListener('click', function () {
                calcMode = calcMode === 'revenue' ? 'profit' : 'revenue';
                document.getElementById('calc-mode-icon').textContent = calcMode === 'profit' ? '📈' : '💰';
                document.getElementById('calc-mode-text').textContent = calcMode === 'profit' ? 'Прибыль' : 'Выручка';
                this.textContent = calcMode === 'profit' ? '≈ Выручка' : '≈ Прибыль';
                updateProfitTotal();
            });

            render();
            attachCardEvents();
        }

        init();
    </script>
</body>

</html>
