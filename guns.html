<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Орудия — WOSB Wiki</title>
    <meta name="description" content="Справочник орудий World of Sea Battle: стоимость крафта, типы, ресурсы">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .gun-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s;
        }

        .gun-card:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
            transform: translateY(-1px);
        }

        .gun-icon {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--bg-dark), rgba(30, 111, 168, 0.2));
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .gun-info {
            flex: 1;
            min-width: 0;
        }

        .gun-name {
            font-size: 15px;
            font-weight: 600;
            color: #e8f4ff;
            margin-bottom: 5px;
        }

        .gun-type-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(42, 159, 214, 0.12);
            color: var(--accent2);
            border: 1px solid rgba(42, 159, 214, 0.2);
            margin-bottom: 8px;
        }

        .gun-cost {
            font-size: 13px;
            color: var(--gold-light);
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
            text-align: right;
        }

        .gun-cost-label {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 400;
            display: block;
        }

        .type-section {
            margin-bottom: 28px;
        }

        .type-header {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent2);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .type-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Только иконка — не расходуем ресурсы */
        .pirate-only {
            color: var(--gold);
        }
    </style>
</head>

<body>

    <header>
        <div class="header-inner">
            <a href="index.html" class="logo"><span class="logo-anchor">⚓</span> WOSB Wiki</a>
            <nav>
                <a href="index.html">🚢 <span class="nav-text">Корабли</span></a>
                <a href="craft.html">🔨 <span class="nav-text">Крафт</span></a>
                <a href="calculator.html">🧮 <span class="nav-text">Калькулятор</span></a>
                <a href="guns.html" class="active">💣 <span class="nav-text">Орудия</span></a>
            </nav>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1 class="page-title">💣 Орудия</h1>
            <p class="page-subtitle">Стоимость крафта и ресурсы для всех орудий</p>
        </div>

        <!-- Фильтры -->
        <div class="filters" style="margin-bottom:24px;">
            <div class="filter-group">
                <div class="filter-label">🔍 Поиск</div>
                <input type="text" id="search-input" placeholder="Название орудия...">
            </div>
            <div class="filter-group">
                <div class="filter-label">🎯 Тип</div>
                <div class="btn-group" id="type-filters"></div>
            </div>
            <button class="btn-reset" id="btn-reset">↺ Сбросить</button>
        </div>

        <div class="stats-bar">
            <div class="stat-chip">Найдено: <span id="gun-count">0</span> орудий</div>
        </div>

        <div id="guns-container"></div>
    </main>

    <script src="js/guns_data.js"></script>
    <script>
        (function () {
            let activeType = null;
            let searchQuery = '';

            const container = document.getElementById('guns-container');
            const countEl = document.getElementById('gun-count');
            const searchEl = document.getElementById('search-input');

            function filtered() {
                return GUNS.filter(g => {
                    if (activeType && g.type !== activeType) return false;
                    if (searchQuery && !g.name.toLowerCase().includes(searchQuery)) return false;
                    return true;
                });
            }

            function render() {
                const guns = filtered();
                countEl.textContent = guns.length;

                // Группируем по типам
                const types = [...new Set(GUNS.map(g => g.type))];
                const byType = {};
                types.forEach(t => byType[t] = guns.filter(g => g.type === t));

                container.innerHTML = types.map(type => {
                    const items = byType[type];
                    if (!items.length) return '';

                    const cards = items.map(g => {
                        const res = Object.entries(g)
                            .filter(([k]) => GUN_RES_LABELS[k] && g[k] > 0)
                            .map(([k, v]) => {
                                const r = GUN_RES_LABELS[k];
                                return `<div class="res-item" title="${r.label}">
              <span class="res-emoji">${r.emoji}</span>
              <span class="res-value">${v.toLocaleString('ru-RU')}</span>
            </div>`;
                            }).join('');

                        const costDisplay = g.cost > 0
                            ? `<div style="color:var(--gold-light);font-size:13px;font-weight:700">${g.cost.toLocaleString('ru-RU')} ₽</div><div class="gun-cost-label">примерная себестоимость</div>`
                            : `<div style="color:var(--text-muted);font-size:12px">— биржа</div>`;

                        return `
          <div class="gun-card">
            <div class="gun-icon">${GUN_TYPE_ICONS[g.type] || '💥'}</div>
            <div class="gun-info">
              <div class="gun-name">${g.name}${g.qty > 1 ? ` <span style="color:var(--text-muted);font-size:12px">x${g.qty}</span>` : ''}</div>
              <div class="res-grid">${res || '<span style="color:var(--text-muted);font-size:12px">нет ресурсов</span>'}</div>
            </div>
            <div class="gun-cost">${costDisplay}</div>
          </div>`;
                    }).join('');

                    return `
        <div class="type-section">
          <div class="type-header">${GUN_TYPE_ICONS[type]} ${type}</div>
          <div style="display:grid;gap:8px;">${cards}</div>
        </div>`;
                }).join('');
            }

            // Кнопки фильтров
            const types = [...new Set(GUNS.map(g => g.type))];
            const typeContainer = document.getElementById('type-filters');
            types.forEach(t => {
                const btn = document.createElement('button');
                btn.className = 'btn-filter';
                btn.innerHTML = `${GUN_TYPE_ICONS[t] || ''} ${t}`;
                btn.addEventListener('click', () => {
                    activeType = activeType === t ? null : t;
                    document.querySelectorAll('#type-filters .btn-filter').forEach(b => b.classList.remove('active', 'active-type'));
                    if (activeType) btn.classList.add('active', 'active-type');
                    render();
                });
                typeContainer.appendChild(btn);
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                activeType = null;
                searchQuery = '';
                searchEl.value = '';
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active', 'active-type'));
                render();
            });

            searchEl.addEventListener('input', function () {
                searchQuery = this.value.toLowerCase().trim();
                render();
            });

            render();
        })();
    </script>
</body>

</html>
